[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.dependencies]
solami = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
dashmap = "6"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors"] }
dotenvy = "0.15"
base64 = "0.22"
solana-signer = "3"
solana-instruction = "3"
solana-pubkey = "4"
solana-client = "4.2"

shadow-core = { path = "crates/core" }
shadow-ingest = { path = "crates/ingest" }
shadow-engine = { path = "crates/engine" }
shadow-trader = { path = "crates/trader" }

[profile.release]
lto = "thin"
codegen-units = 1

# Vendored copy of solami 0.1.58 with one change: its build.rs uses a prebuilt
# protoc (PROTOC env var / PATH) instead of compiling protobuf from source with
# cmake. See vendor/solami/build.rs.
[patch.crates-io]
solami = { path = "vendor/solami" }
